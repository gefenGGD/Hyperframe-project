<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      [data-composition-id="main"] {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      [data-composition-id="main"] video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8.3"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="source"
        class="clip"
        src="assets/source.mov"
        data-start="0"
        data-duration="8.3"
        data-track-index="0"
        muted
        playsinline
      ></video>

      <audio
        id="source-audio"
        src="assets/source.mov"
        data-start="0"
        data-duration="8.3"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="signature"
        data-composition-src="compositions/hw-title.html"
        data-composition-id="signature"
        data-start="0"
        data-duration="8.3"
        data-width="1080"
        data-height="1920"
        data-track-index="1"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
